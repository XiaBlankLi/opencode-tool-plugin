name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install vsce
        run: npm i -g @vscode/vsce
      - name: Package VSIX
        run: vsce package --allow-missing-repository -o opencode-tool-plugin.vsix
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: opencode-tool-plugin.vsix
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: opencode-tool-plugin.vsix
          generate_release_notes: true